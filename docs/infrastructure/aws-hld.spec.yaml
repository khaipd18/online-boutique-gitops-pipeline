# HLD diagram spec for the Online Boutique platform on AWS.
# Source of truth for docs/infrastructure/aws-hld.drawio; regenerate with the
# aws-hld-drawio skill (validate.py / generate_drawio.py) after editing.
#
# Everything here mirrors terraform/ and gitops/:
#   - VPC 10.18.0.0/16, 2 AZs, public + private subnet per AZ, ONE NAT gateway in the
#     first public subnet (cost trade-off: AZ-b egress depends on AZ-a)
#   - EKS 1.35 managed node group in the private subnets
#   - interface endpoints ecr.api / ecr.dkr / sts + S3 gateway endpoint
#   - the load balancer is created by Kubernetes (Service frontend-external, in-tree
#     cloud provider -> Classic Load Balancer), not by Terraform
#   - IAM (GitHub OIDC provider + roles) is global, drawn outside the Region
title: "Online Boutique on AWS - HLD"
pages:
  - name: "01 Logical architecture"
    level: hld
    direction: row
    items:
      - id: users
        service: users
        label: "Shoppers"

      - group: aws_cloud
        direction: row
        items:
          - group: region
            label: "ap-southeast-1"
            direction: row
            items:
              - group: vpc
                id: vpc
                label: "VPC 10.18.0.0/16"
                direction: column
                items:
                  - group: layout
                    direction: column
                    items:
                      # Private subnet first: the load balancer wires arrive from the
                      # left, so the nodes sit on the left edge of each AZ band.
                      - group: az
                        label: "AZ apse1-az1"
                        items:
                          - group: private_subnet
                            items:
                              - {id: nodes_a, service: ec2, label: "EKS worker nodes"}
                          - group: public_subnet
                            items:
                              - {id: nat, service: nat_gateway, note: "shared by both AZs"}
                      # Cross-AZ resources sit between the AZ bands
                      - group: layout
                        items:
                          - {id: lb, service: elb, label: "Load Balancer", note: "frontend-external"}
                          - {id: eks, service: eks, label: "Amazon EKS 1.35", note: "Argo CD + 10 services"}
                          - {id: igw, service: internet_gateway}
                          - {id: vpce, service: vpc_endpoint, label: "VPC endpoints", note: "ECR, STS, S3"}
                      # AZ-b has no NAT gateway: one NAT keeps cost down; egress from
                      # AZ-b depends on AZ-a (accepted trade-off for a dev environment).
                      - group: az
                        label: "AZ apse1-az2"
                        items:
                          - group: private_subnet
                            items:
                              - {id: nodes_b, service: ec2, label: "EKS worker nodes"}
                          - group: public_subnet
                            items: []
              # Regional services in one column; ECR in the middle so its two wires
              # (VPC endpoints on the left, GitHub Actions on the right) stay short.
              - group: layout
                direction: column
                items:
                  - {id: tfstate, service: s3, label: "Terraform state"}
                  - {id: ecr, service: ecr, note: "immutable tags, scan on push"}
                  - {id: tflock, service: dynamodb, label: "State lock"}
                  - {id: logs, service: cloudwatch, note: "control plane logs"}
          - {id: iam, service: iam, label: "IAM OIDC roles", note: "plan · apply · push"}

      - {id: github, tech: github, label: "GitHub Actions"}

    edges:
      - {from: users, to: lb, label: "HTTP"}
      - {from: lb, to: nodes_a, label: "NodePort"}
      - {from: lb, to: nodes_b, label: "NodePort"}
      - {from: vpce, to: ecr, label: "image pull (PrivateLink)"}
      - {from: nat, to: igw, label: "egress"}
      - {from: github, to: iam, label: "OIDC"}
      - {from: github, to: ecr, label: "push image"}
      - {from: eks, to: github, label: "GitOps pull", style: dashed}

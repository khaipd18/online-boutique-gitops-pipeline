deployment: 
  enabled: true

replicaCount: 1

# CPU-based Horizontal Pod Autoscaler. Needs metrics-server and resources.requests.cpu; replicaCount is ignored while it is on
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# Keeps minAvailable pods running during voluntary disruptions such as node drains.
# Only rendered when the service runs 2+ replicas: a budget of 1 on a single replica would block every drain
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Spread replicas across zones, then nodes, when possible (soft constraint, never blocks scheduling)
topologySpread:
  enabled: true

serviceAccount:
  create: false
  name: ""

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  enabled: false
  type: ClusterIP
  port: 80
  targetPort: 8080

env: {}

resources: {}

probes: {}

volumes: []
volumeMounts: []

# Secure by default: satisfies the Pod Security "restricted" profile. Services can override individual fields.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# None of the services call the Kubernetes API
automountServiceAccountToken: false

networkPolicy:
  enabled: true
  # app labels (release names) of the pods allowed to connect to service.targetPort; empty denies all ingress
  allowFrom: []
  # allow ingress from any source on service.targetPort (e.g. a pod exposed through a LoadBalancer)
  allowFromAnywhere: false
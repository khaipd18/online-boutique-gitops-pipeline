{{- if and .Values.deployment.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.allowFromAnywhere }}
  ingress:
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
  {{- else if .Values.networkPolicy.allowFrom }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFrom }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}

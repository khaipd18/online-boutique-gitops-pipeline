deployment:
  enabled: true
replicaCount: 1
serviceAccount:
  create: true
  name: "cartservice"
image:
  repository: 445817183958.dkr.ecr.ap-southeast-1.amazonaws.com/cartservice
  tag: "18da8f445f90cf00ebb100c9e9983639a4f5eaae"
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  port: 7070
  targetPort: 7070
env:
  REDIS_ADDR: "redis-cart-dev:6379"
resources:
  limits:
    cpu: 300m
    memory: 128Mi
  requests:
    cpu: 200m
    memory: 64Mi
probes:
  readiness:
    grpc:
      port: 7070
    initialDelaySeconds: 15
    periodSeconds: 15
  liveness:
    grpc:
      port: 7070
    initialDelaySeconds: 15
    periodSeconds: 15
networkPolicy:
  allowFrom:
    - frontend-dev
    - checkoutservice-dev

deployment:
  enabled: true
replicaCount: 1
serviceAccount:
  create: true
  name: "recommendationservice"
image:
  repository: 445817183958.dkr.ecr.ap-southeast-1.amazonaws.com/recommendationservice
  tag: "065afb1ba9d018c50935488bfb3a136d8ef47d5f"
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
env:
  PORT: "8080"
  ENABLE_TRACING: "1"
  COLLECTOR_SERVICE_ADDR: "localhost:4317"
  PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice-dev:3550"
resources:
  limits:
    cpu: 200m
    memory: 500Mi
  requests:
    cpu: 100m
    memory: 250Mi
probes:
  readiness:
    grpc:
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 20
  liveness:
    grpc:
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 20
networkPolicy:
  allowFrom:
    - frontend-dev

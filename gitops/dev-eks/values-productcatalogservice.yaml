deployment:
  enabled: true
replicaCount: 1
serviceAccount:
  create: true
  name: "productcatalogservice"
image:
  repository: 445817183958.dkr.ecr.ap-southeast-1.amazonaws.com/productcatalogservice
  tag: "065afb1ba9d018c50935488bfb3a136d8ef47d5f"
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  port: 3550
  targetPort: 3550
env:
  PORT: "3550"
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi
probes:
  readiness:
    grpc:
      port: 3550
    initialDelaySeconds: 20
    periodSeconds: 20
  liveness:
    grpc:
      port: 3550
    initialDelaySeconds: 20
    periodSeconds: 20
networkPolicy:
  allowFrom:
    - frontend-dev
    - checkoutservice-dev
    - recommendationservice-dev

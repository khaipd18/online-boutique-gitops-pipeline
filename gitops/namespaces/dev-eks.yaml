apiVersion: v1
kind: Namespace
metadata:
  name: dev-eks
  labels:
    # Pod Security Admission: reject pods that do not meet the "restricted" profile
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # Never delete the namespace (and every workload in it) from a sync
    argocd.argoproj.io/sync-options: Delete=false

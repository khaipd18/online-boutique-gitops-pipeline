name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'

permissions:
  contents: read

env:
  # Target AWS account: set the repository variable AWS_ACCOUNT_ID (Settings > Secrets and variables > Actions > Variables).
  # Without it, only the Checkov scan runs.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  checkov:
    name: 'Checkov Scan'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Checkov
      run: pip install checkov==3.3.22

    # Blocking gate: findings accepted in terraform/.checkov.baseline are ignored, any new finding fails the run
    # To accept a new finding, fix it or regenerate the baseline with --create-baseline in a reviewed PR
    - name: Run Checkov
      run: checkov --config-file .checkov.yaml -d terraform --framework terraform --baseline terraform/.checkov.baseline --compact

  plan:
    name: 'Terraform Plan'
    needs: checkov
    # Needs a target AWS account. GitHub does not issue OIDC tokens to pull requests from forks, so only plan PRs from this repository
    if: vars.AWS_ACCOUNT_ID != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    # A newer push to the same PR cancels its older plan
    concurrency:
      group: terraform-plan-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    # Read-only role, trusted only for pull_request tokens
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform-plan-oidc-role
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.14.8"

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: terraform validate -no-color

    # The plan role has no write access to the lock table, so plan runs without taking the state lock
    - name: Terraform Plan
      run: terraform plan -no-color -input=false -lock=false

  apply:
    name: 'Terraform Apply'
    needs: checkov
    # Needs a target AWS account; runs only for pushes to main
    if: vars.AWS_ACCOUNT_ID != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Waits for a reviewer to approve. The admin role trusts only tokens from this environment (sub ends in environment:production)
    environment: production
    permissions:
      id-token: write
      contents: read

    # Never run two applies at once
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform-oidc-role
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.14.8"

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: terraform validate -no-color

    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false

name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'

permissions:
  contents: read

env:
  # Target AWS account: set the repository variable AWS_ACCOUNT_ID (Settings > Secrets and variables > Actions > Variables).
  # Without it, only the Checkov scan runs.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  checkov:
    name: 'Checkov Scan'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Checkov
      run: pip install checkov==3.3.22

    # Blocking gate: findings accepted in terraform/.checkov.baseline are ignored, any new finding fails the run
    # To accept a new finding, fix it or regenerate the baseline with --create-baseline in a reviewed PR
    - name: Run Checkov
      run: checkov --config-file .checkov.yaml -d terraform --framework terraform --baseline terraform/.checkov.baseline --compact

  terraform:
    name: 'Terraform Core Workflow'
    needs: checkov
    # Needs a target AWS account. GitHub does not issue OIDC tokens to pull requests from forks, so only plan PRs from this repository
    if: vars.AWS_ACCOUNT_ID != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    # Never run two applies at once; a newer push to the same PR cancels its older plan
    concurrency:
      group: terraform-${{ github.event_name == 'push' && 'apply' || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6 

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        # Pull requests get the read-only plan role; only main gets the apply role (enforced by the IAM trust policies)
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ github.event_name == 'pull_request' && 'github-actions-terraform-plan-oidc-role' || 'github-actions-terraform-oidc-role' }}
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.14.8"

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: terraform validate -no-color

    # The plan role has no write access to the lock table, so plan runs without taking the state lock
    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color -input=false -lock=false

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
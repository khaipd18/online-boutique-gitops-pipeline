name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

jobs:
  checkov:
    name: 'Checkov Scan'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Checkov
      run: pip install checkov==3.3.22

    # Blocking gate: findings accepted in terraform/.checkov.baseline are ignored, any new finding fails the run
    # To accept a new finding, fix it or regenerate the baseline with --create-baseline in a reviewed PR
    - name: Run Checkov
      run: checkov --config-file .checkov.yaml -d terraform --framework terraform --baseline terraform/.checkov.baseline --compact

  terraform:
    name: 'Terraform Core Workflow'
    needs: checkov
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6 

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::797226340543:role/github-actions-terraform-oidc-role
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.14.8"

    - name: Terraform Init
      run: terraform init

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: terraform validate -no-color

    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
name: CI for Node.js Services

on: 
  push:
    branches: [ "main" ]
    paths:
      - 'src/currencyservice/**'
      - 'src/paymentservice/**'
  workflow_dispatch: 
    inputs:
      custom_tag:
        description: 'Image tag to use for this build (optional, defaults to git sha)'
        required: false
        type: string

permissions:
  contents: read

env:
  # Target AWS account: set the repository variable AWS_ACCOUNT_ID (Settings > Secrets and variables > Actions > Variables).
  # Without it, CI still lints, tests, builds and scans the images, and skips the ECR push and GitOps update.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            currencyservice: 'src/currencyservice/**'
            paymentservice: 'src/paymentservice/**'

  build-and-push:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || (needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '') }}
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write 
      contents: write
      pull-requests: write # GitOps update pull request
      security-events: write # upload Trivy findings to code scanning
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON( github.event_name == 'workflow_dispatch' && '["currencyservice", "paymentservice"]' || needs.detect-changes.outputs.matrix ) }}
    
    defaults:
      run:
        working-directory: ./src/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint 9+ no longer reads .eslintrc.json, so pin v8
      - name: Run Linter (ESLint)
        run: npx --yes eslint@8 .

      # Non-blocking until vulnerable dependencies are upgraded; failures show as a warning on the run
      - name: Run Security Scan (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high

      # No unit tests yet: package.json only has the default placeholder test script

      - name: Configure AWS credentials via OIDC
        if: env.AWS_ACCOUNT_ID != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-oidc-role
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        if: env.AWS_ACCOUNT_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        id: build
        env:
          # Without an AWS account the image is only built and scanned, under a local name
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry || 'local' }}
          ECR_REPOSITORY: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.event.inputs.custom_tag || github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          {
            echo "IMAGE=$IMAGE"
            echo "NEW_TAG=$IMAGE_TAG"
            echo "FULL_REPO=$ECR_REGISTRY/$ECR_REPOSITORY"
          } >> "$GITHUB_ENV"

          # ECR tags are immutable: re-running CI for the same commit must not build and push the same tag again
          if [ -n "$AWS_ACCOUNT_ID" ] && docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::notice::$ECR_REPOSITORY:$IMAGE_TAG already exists in ECR, skipping build, scan and push"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            docker build -t "$IMAGE" .
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Scan before pushing; set blocking to 'true' once the service dependencies are upgraded
      - name: Scan Image (Trivy)
        if: steps.build.outputs.exists == 'false'
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ env.IMAGE }}
          name: ${{ matrix.service }}
          blocking: 'false'

      - name: Push Image
        if: steps.build.outputs.exists == 'false' && env.AWS_ACCOUNT_ID != ''
        run: docker push "$IMAGE"

      # main requires pull requests, so the image tag is written through a pull request the bot merges itself
      - name: Update GitOps through a pull request
        if: env.AWS_ACCOUNT_ID != ''
        uses: ./.github/actions/gitops-update
        with:
          service: ${{ matrix.service }}
          repository: ${{ env.FULL_REPO }}
          tag: ${{ env.NEW_TAG }}

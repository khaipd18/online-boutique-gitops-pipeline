name: CI for Java Services

on: 
  push:
    branches: [ "main" ]
    paths:
      - 'src/adservice/**'
  workflow_dispatch: 
    inputs:
      custom_tag:
        description: 'Image tag to use for this build (optional, defaults to git sha)'
        required: false
        type: string

permissions:
  contents: read

env:
  # Target AWS account: set the repository variable AWS_ACCOUNT_ID (Settings > Secrets and variables > Actions > Variables).
  # Without it, CI still lints, tests, builds and scans the images, and skips the ECR push and GitOps update.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            adservice: 'src/adservice/**'

  build-and-push:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || (needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '') }}
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write 
      contents: write
      security-events: write # upload Trivy findings to code scanning
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON( github.event_name == 'workflow_dispatch' && '["adservice"]' || needs.detect-changes.outputs.matrix ) }}
    
    defaults:
      run:
        working-directory: ./src/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '24' # keep in sync with the builder JDK in src/adservice/Dockerfile
          distribution: 'temurin' 
          cache: 'gradle' 

      - name: Grant execute permission for gradlew
        # file gradlew may not have execute permissions by default
        run: chmod +x gradlew

      # google-java-format needs access to JDK compiler internals on JDK 16+.
      # Non-blocking until existing formatting issues are fixed; failures show as a warning on the run
      - name: Run Linter (google-java-format)
        continue-on-error: true
        run: |
          EXPORTS=""
          for pkg in api code file parser tree util; do
            EXPORTS="$EXPORTS --add-exports=jdk.compiler/com.sun.tools.javac.$pkg=ALL-UNNAMED"
          done
          ./gradlew "-Dorg.gradle.jvmargs=$EXPORTS" verifyGoogleJavaFormat

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Application (Optional)
        # Ensure source code is compiled into a .jar file before packaging Docker
        run: ./gradlew build -x test -x verifyGoogleJavaFormat

      - name: Configure AWS credentials via OIDC
        if: env.AWS_ACCOUNT_ID != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-oidc-role
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        if: env.AWS_ACCOUNT_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        id: build
        env:
          # Without an AWS account the image is only built and scanned, under a local name
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry || 'local' }}
          ECR_REPOSITORY: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.event.inputs.custom_tag || github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          {
            echo "IMAGE=$IMAGE"
            echo "NEW_TAG=$IMAGE_TAG"
            echo "FULL_REPO=$ECR_REGISTRY/$ECR_REPOSITORY"
          } >> "$GITHUB_ENV"

          # ECR tags are immutable: re-running CI for the same commit must not build and push the same tag again
          if [ -n "$AWS_ACCOUNT_ID" ] && docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::notice::$ECR_REPOSITORY:$IMAGE_TAG already exists in ECR, skipping build, scan and push"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            docker build -t "$IMAGE" .
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Scan before pushing; set blocking to 'true' once the service dependencies are upgraded
      - name: Scan Image (Trivy)
        if: steps.build.outputs.exists == 'false'
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ env.IMAGE }}
          name: ${{ matrix.service }}
          blocking: 'false'

      - name: Push Image
        if: steps.build.outputs.exists == 'false' && env.AWS_ACCOUNT_ID != ''
        run: docker push "$IMAGE"

      - name: Update GitOps and Push Back
        if: env.AWS_ACCOUNT_ID != ''
        working-directory: . 
        run: |
          # Update image configs
          yq -i '.image.repository = "${{ env.FULL_REPO }}"' gitops/dev-eks/values-${{ matrix.service }}.yaml
          yq -i '.image.tag = "${{ env.NEW_TAG }}"' gitops/dev-eks/values-${{ matrix.service }}.yaml

          # Configure git bot
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Commit changes
          git add gitops/dev-eks/values-${{ matrix.service }}.yaml
          git commit -m "chore(gitops): update ${{ matrix.service }} to ${{ env.NEW_TAG }} [skip ci]"

          # Retry loop for concurrent pushes
          for i in {1..5}; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Successfully pushed ${{ matrix.service }} updates."
              exit 0
            fi
            echo "Conflict detected (attempt $i/5). Retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          
          echo "Failed to push after 5 attempts."
          exit 1
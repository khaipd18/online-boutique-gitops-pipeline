name: CI for Go Services

on: 
  push:
    branches: [ "main" ]
    paths:
      - 'src/frontend/**'
      - 'src/checkoutservice/**'
      - 'src/productcatalogservice/**'
      - 'src/shippingservice/**'
  workflow_dispatch: 
    inputs:
      custom_tag:
        description: 'Image tag to use for this build (optional, defaults to git sha)'
        required: false
        type: string

permissions:
  contents: read

env:
  # Target AWS account: set the repository variable AWS_ACCOUNT_ID (Settings > Secrets and variables > Actions > Variables)
  # to deploy to another account. Falls back to the original project account.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '797226340543' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend: 'src/frontend/**'
            checkoutservice: 'src/checkoutservice/**'
            productcatalogservice: 'src/productcatalogservice/**'
            shippingservice: 'src/shippingservice/**'

  build-and-push:
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' || (needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '') }}
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write 
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON( github.event_name == 'workflow_dispatch' && '["frontend", "checkoutservice", "productcatalogservice", "shippingservice"]' || needs.detect-changes.outputs.matrix ) }}
    
    defaults:
      run:
        working-directory: ./src/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: src/${{ matrix.service }}/go.sum 

      - name: Download dependencies
        run: go mod download

      # Pinned to the last v1 release: src/*/.golangci.yml use the v1 config format
      - name: Run Linter (golangci-lint)
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run ./...

      - name: Run Unit Tests
        run: go test -v ./...

      # Non-blocking until vulnerable dependencies (grpc, otel) are upgraded; failures show as a warning on the run
      - name: Run Security Scan (govulncheck)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-oidc-role
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.service }} 
          IMAGE_TAG: ${{ github.event.inputs.custom_tag || github.sha }}
        run: |
          # ECR tags are immutable: re-running CI for the same commit must not push the same tag again
          if docker manifest inspect "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "::notice::$ECR_REPOSITORY:$IMAGE_TAG already exists in ECR, skipping build and push"
          else
            docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          echo "NEW_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FULL_REPO=$ECR_REGISTRY/$ECR_REPOSITORY" >> $GITHUB_ENV

      - name: Update GitOps and Push Back
        working-directory: . 
        run: |
          # Update image configs
          yq -i '.image.repository = "${{ env.FULL_REPO }}"' gitops/dev-eks/values-${{ matrix.service }}.yaml
          yq -i '.image.tag = "${{ env.NEW_TAG }}"' gitops/dev-eks/values-${{ matrix.service }}.yaml

          # Configure git bot
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Commit changes
          git add gitops/dev-eks/values-${{ matrix.service }}.yaml
          git commit -m "chore(gitops): update ${{ matrix.service }} to ${{ env.NEW_TAG }} [skip ci]"

          # Retry loop for concurrent pushes
          for i in {1..5}; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Successfully pushed ${{ matrix.service }} updates."
              exit 0
            fi
            echo "Conflict detected (attempt $i/5). Retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          
          echo "Failed to push after 5 attempts."
          exit 1